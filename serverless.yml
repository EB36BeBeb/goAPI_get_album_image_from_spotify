# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ebebworkspace
# "service" is the name of this project. This will also be added to your AWS resource names.
service: spotiyCoverAPI
frameworkVersion: '4'

provider:
  name: aws
  runtime: provided.al2
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  region: ap-northeast-1
  httpApi:
    cors: true

package:
  individually: true # <- package each function individually, to prevent file name conflicts


functions:
  getimage:
    handler: bootstrap
    package:
      artifact: getImage/getImage.zip
    memorySize: 256
    timeout: 10
    environment:
      ${file(token.yml):}
    events:
      - httpApi:
          path: /getimage
          method: post
          
  getinfo:
    handler: bootstrap
    package:
      artifact: getPlaylistInfo/getPlaylistInfo.zip
    memorySize: 256
    timeout: 10
    environment:
      ${file(token.yml):}
    events:
      - httpApi:
          path: /getPlaylistInfo
          method: post